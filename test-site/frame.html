<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Lieferadresse</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0.5rem; color: #1a1a1a; }
      form { display: grid; gap: 0.5rem; }
      input { font: inherit; padding: 0.4rem; border: 1px solid #555; border-radius: 4px; }
      :focus-visible { outline: 3px solid #1a56db; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <form>
      <label for="street">Straße</label>
      <input id="street" name="street">
      <label for="zip">PLZ</label>
      <input id="zip" name="zip">
      <label for="city">Ort</label>
      <input id="city" name="city">
    </form>
    <script type="module" src="/src/frame.ts"></script>
  </body>
</html>
