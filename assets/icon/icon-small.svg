<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Simplified for 16px and 32px: no wave, bubbles or cursor, heavier outline. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3649D4"/>
      <stop offset=".55" stop-color="#1D00AD"/>
      <stop offset="1" stop-color="#170092"/>
    </linearGradient>
    <clipPath id="field"><rect x="12" y="34" width="104" height="60" rx="16"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <g clip-path="url(#field)">
    <rect x="12" y="34" width="104" height="60" fill="#0B005F" fill-opacity=".55"/>
    <rect x="12" y="66" width="104" height="28" fill="#4AC9C9"/>
  </g>
  <rect x="12" y="34" width="104" height="60" rx="16" fill="none" stroke="#fff" stroke-width="12"/>
</svg>
